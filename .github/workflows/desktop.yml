name: Desktop Firefox ESR

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  ui-tests:
    name: UI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate policy JSON and JavaScript
        run: |
          python3 -m json.tool desktop/distribution/policies-linux.json >/dev/null
          python3 -m json.tool desktop/distribution/policies.json >/dev/null
          node --check desktop/ui/core.js
          node --check desktop/ui/app.js
      - name: Run start-page unit tests
        run: node --test desktop/ui/core.test.cjs

  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test start-page logic
        run: node --test desktop/ui/core.test.cjs
      - name: Download Firefox ESR
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.mozilla.org/?product=firefox-esr-latest&os=win64&lang=en-US" -OutFile firefox-setup.exe
          7z x firefox-setup.exe -ostaging -y
          $browser = Get-ChildItem staging -Filter firefox.exe -Recurse | Select-Object -First 1
          if (-not $browser) { throw "Firefox executable not found in Mozilla package" }
          New-Item -ItemType Directory -Force package/firefox/distribution | Out-Null
          New-Item -ItemType Directory -Force package/ui | Out-Null
          Copy-Item "$($browser.Directory.FullName)/*" package/firefox -Recurse -Force
      - name: Assemble portable Tiho package
        shell: pwsh
        run: |
          Copy-Item desktop/distribution/policies.json package/firefox/distribution/policies.json -Force
          Copy-Item desktop/ui/* package/ui/ -Recurse -Force
          Copy-Item desktop/launchers/Tiho-Bank.cmd package/Tiho-Bank.cmd
          Copy-Item desktop/launchers/Tiho-Private.cmd package/Tiho-Private.cmd
          Copy-Item desktop/README.md package/README-TIHO.txt
          @'
          @echo off
          setlocal
          set "TIHO_PROFILE=%APPDATA%\Tiho\profile"
          if not exist "%TIHO_PROFILE%" mkdir "%TIHO_PROFILE%"
          if not exist "%TIHO_PROFILE%\user.js" (
            powershell -NoProfile -ExecutionPolicy Bypass -Command "$root=(Resolve-Path '%~dp0').Path; $ui=[Uri]::new((Join-Path $root 'ui\index.html')).AbsoluteUri; $line='user_pref("browser.startup.homepage", '+(ConvertTo-Json -Compress $ui)+');'; Set-Content -LiteralPath (Join-Path '%TIHO_PROFILE%' 'user.js') -Value $line -Encoding ascii"
          )
          start "" "%~dp0firefox\firefox.exe" -profile "%TIHO_PROFILE%" %*
          '@ | Set-Content package/Tiho.cmd -Encoding ascii
          $hash = (Get-FileHash package/firefox/firefox.exe -Algorithm SHA256).Hash.ToLower()
          "firefox.exe  $hash" | Out-File package/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path package/firefox,package/ui,package/Tiho.cmd,package/Tiho-Bank.cmd,package/Tiho-Private.cmd,package/README-TIHO.txt,package/SHA256SUMS.txt -DestinationPath Tiho-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tiho-Windows-x64
          path: Tiho-Windows-x64.zip
          retention-days: 14

  linux:
    name: Linux x86_64 DEB package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package and validation tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev lintian desktop-file-utils shellcheck nodejs
      - name: Validate sources
        run: |
          python3 -m json.tool desktop/distribution/policies-linux.json >/dev/null
          node --check desktop/ui/core.js
          node --check desktop/ui/app.js
          node --test desktop/ui/core.test.cjs
      - name: Download official Firefox ESR
        run: |
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 "https://download.mozilla.org/?product=firefox-esr-latest&os=linux64&lang=en-US" -o firefox.tar.xz
          mkdir staging
          tar -xJf firefox.tar.xz -C staging
          test -x staging/firefox/firefox
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^Version: *//p' staging/firefox/application.ini | head -1)"
          if [ -z "$VERSION" ]; then VERSION="$(grep -m1 '^Version=' staging/firefox/application.ini | cut -d= -f2 || true)"; fi
          if [ -z "$VERSION" ]; then echo "Could not determine Firefox ESR version" >&2; exit 1; fi
          PKG="tiho-browser_${VERSION}-1_amd64"
          ROOT="pkg/$PKG"
          install -d "$ROOT/DEBIAN" "$ROOT/opt/tiho/ui" "$ROOT/opt/tiho/firefox/distribution" "$ROOT/usr/bin" "$ROOT/usr/share/applications" "$ROOT/usr/share/icons/hicolor/scalable/apps" "$ROOT/usr/share/doc/tiho-browser"
          cp -a staging/firefox/. "$ROOT/opt/tiho/firefox/"
          install -m 0644 desktop/distribution/policies-linux.json "$ROOT/opt/tiho/firefox/distribution/policies.json"
          cp -a desktop/ui/. "$ROOT/opt/tiho/ui/"
          install -m 0644 desktop/tiho-browser.svg "$ROOT/usr/share/icons/hicolor/scalable/apps/tiho-browser.svg"
          install -m 0644 desktop/README.md "$ROOT/usr/share/doc/tiho-browser/README"
          install -m 0644 desktop/copyright "$ROOT/usr/share/doc/tiho-browser/copyright"
          install -m 0644 LICENSE "$ROOT/usr/share/doc/tiho-browser/LICENSE"
          install -d "$ROOT/usr/share/lintian/overrides"
          install -m 0644 desktop/lintian-overrides "$ROOT/usr/share/lintian/overrides/tiho-browser"
          printf 'tiho-browser (%s-1) unstable; urgency=medium\n\n  * Initial desktop package with isolated profiles and validated start page.\n\n -- Ivan Vorontsov <ivanivorontsov@gmail.com>  %s\n' "$VERSION" "$(date -R -u)" > "$ROOT/usr/share/doc/tiho-browser/changelog.Debian"
          gzip -n "$ROOT/usr/share/doc/tiho-browser/changelog.Debian"
          install -m 0755 desktop/launchers/tiho-bank "$ROOT/usr/bin/tiho-bank"
          install -m 0755 desktop/launchers/tiho-private "$ROOT/usr/bin/tiho-private"
          install -m 0644 desktop/launchers/tiho-bank.desktop "$ROOT/usr/share/applications/tiho-bank.desktop"
          install -m 0644 desktop/launchers/tiho-private.desktop "$ROOT/usr/share/applications/tiho-private.desktop"
          cat > "$ROOT/usr/bin/tiho" <<'LAUNCHER'
          #!/bin/sh
          set -eu
          : "${HOME:?HOME must be set to launch Tiho}"
          CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
          PROFILE="$CONFIG_HOME/tiho/profile"
          mkdir -p "$PROFILE"
          exec /opt/tiho/firefox/firefox -profile "$PROFILE" "$@"
          LAUNCHER
          chmod 0755 "$ROOT/usr/bin/tiho"
          cat > "$ROOT/usr/share/applications/tiho-browser.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Name=Тихо
          GenericName=Приватный веб-браузер
          Comment=Firefox ESR с интерфейсом и настройками Тихо
          Exec=/usr/bin/tiho %U
          Icon=tiho-browser
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          StartupNotify=true
          DESKTOP
          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: tiho-browser
          Version: ${VERSION}-1
          Section: web
          Priority: optional
          Architecture: amd64
          Maintainer: Ivan Vorontsov
          Depends: libc6 (>= 2.17), libgtk-3-0 | libgtk-3-0t64, libdbus-glib-1-2, libasound2 | libasound2t64, libnss3, libx11-6, libx11-xcb1, libxcb1, libxcomposite1, libxdamage1, libxext6, libxfixes3, libxrandr2, libxtst6, libxrender1, libfontconfig1, libfreetype6, libglib2.0-0, libstdc++6
          Description: Тихо — приватный браузер для Linux
           Firefox ESR with Tiho start page and privacy policies.
          CONTROL
          dpkg-deb --build --root-owner-group "$ROOT" Tiho-Linux-x86_64.deb
          dpkg-deb --info Tiho-Linux-x86_64.deb
          desktop-file-validate "$ROOT/usr/share/applications/tiho-browser.desktop"
          desktop-file-validate "$ROOT/usr/share/applications/tiho-bank.desktop"
          desktop-file-validate "$ROOT/usr/share/applications/tiho-private.desktop"
          shellcheck "$ROOT/usr/bin/tiho" "$ROOT/usr/bin/tiho-bank" "$ROOT/usr/bin/tiho-private"
          lintian --fail-on error Tiho-Linux-x86_64.deb
          sudo apt-get install -y ./Tiho-Linux-x86_64.deb
          test -x /usr/bin/tiho
          test -x /usr/bin/tiho-bank
          test -x /usr/bin/tiho-private
          SMOKE_DIR="$(mktemp -d)"
          XDG_CONFIG_HOME="$SMOKE_DIR/config" timeout 30s tiho --headless --version
          XDG_CONFIG_HOME="$SMOKE_DIR/config" timeout 30s tiho-bank --headless --version
          XDG_CONFIG_HOME="$SMOKE_DIR/config" timeout 30s tiho-private --headless --version
          (
            cd "$SMOKE_DIR"
            XDG_CONFIG_HOME="$SMOKE_DIR/config" timeout 60s tiho --headless --window-size=1280,900 --screenshot "file:///opt/tiho/ui/index.html"
          )
          test -s "$SMOKE_DIR/screenshot.png"
          test "$(stat -c %s "$SMOKE_DIR/screenshot.png")" -gt 1000
          test -d "$SMOKE_DIR/config/tiho/profile"
          test -d "$SMOKE_DIR/config/tiho/bank-profile"
          mkdir -p unpacked
          dpkg-deb --extract Tiho-Linux-x86_64.deb unpacked
          test -x unpacked/opt/tiho/firefox/firefox
          test -x unpacked/usr/bin/tiho
          test -x unpacked/usr/bin/tiho-bank
          test -x unpacked/usr/bin/tiho-private
          test -f unpacked/opt/tiho/firefox/distribution/policies.json
          test -f unpacked/opt/tiho/ui/index.html
          sha256sum Tiho-Linux-x86_64.deb > SHA256SUMS-tiho-linux.txt
          sudo apt-get remove -y tiho-browser
          test -d "$SMOKE_DIR/config/tiho/profile"
          test -d "$SMOKE_DIR/config/tiho/bank-profile"
      - uses: actions/upload-artifact@v4
        with:
          name: Tiho-Linux-x86_64-DEB
          path: |
            Tiho-Linux-x86_64.deb
            SHA256SUMS-tiho-linux.txt
          retention-days: 14
      - name: Attach DEB to desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-v153.6.0 Tiho-Linux-x86_64.deb SHA256SUMS-tiho-linux.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit desktop-v153.6.0 --notes "Тихо для Linux x86_64: Tiho-Linux-x86_64.deb для Debian 13, Ubuntu и совместимых систем. Установка: sudo apt install ./Tiho-Linux-x86_64.deb. SHA-256 опубликован в SHA256SUMS-tiho-linux.txt."
